services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: jobposting_front
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - back
    networks:
      - jobposting_net

  back:
    build:
      context: .
      dockerfile: docker/back/Dockerfile
    container_name: jobposting_back
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./back:/var/www
      - ./docker/back/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      - db
      - redis
    networks:
      - jobposting_net

  nginx:
    image: nginx:1.27-alpine
    container_name: jobposting_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./back:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - back
    networks:
      - jobposting_net

  db:
    image: mysql:8.4
    container_name: jobposting_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jobposting}
      MYSQL_USER: ${MYSQL_USER:-jobposting}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jobposting}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - jobposting_net

  redis:
    image: redis:7-alpine
    container_name: jobposting_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jobposting_net

volumes:
  db_data:
  redis_data:

networks:
  jobposting_net:
    driver: bridge
